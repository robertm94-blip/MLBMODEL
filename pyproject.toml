[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis_model"
version = "0.1.0"
description = "ATP + WTA pre-match tennis betting model with walk-forward backtesting."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "requests>=2.31",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.scripts]
tennis-model = "tennis_model.run:main"

[tool.setuptools]
packages = ["tennis_model"]
include-package-data = true

[tool.setuptools.package-data]
tennis_model = ["config.yaml"]
